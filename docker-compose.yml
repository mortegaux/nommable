# Nommable — Docker Compose (single container)
#
# One container, one volume (/data), one port. The backend serves the API
# and the frontend SPA. SQLite database lives at /data/nommable.db.
#
# Secrets are NOT stored here. Set them as stack environment variables in
# Portainer (Stacks -> nommable -> Environment variables), or copy
# `.env.example` to `.env` and fill in real values before running:
#
#   cp .env.example .env
#   docker compose up -d
#
# The `:?` syntax below makes compose fail fast with a clear message if a
# required secret is missing.

services:
  nommable:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nommable
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      # SQLite database file (on the persistent volume)
      DB_PATH: /data/nommable.db
      # Auth secret for Better Auth session signing (JWT_SECRET also accepted
      # by the app as a legacy alias if BETTER_AUTH_SECRET is unset)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8992}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (64 hex chars)}
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@nommable.local}
    ports:
      - '${HOST_PORT:-8992}:3001'
    volumes:
      - nommable_data:/data
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: inside the container, localhost resolves to
      # IPv6 [::1] first, but the app binds IPv4 only (0.0.0.0) — with
      # --tries=1 wget gave up on the ::1 refusal and never tried IPv4,
      # so the check failed forever while the app served fine.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  nommable_data:
