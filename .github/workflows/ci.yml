# CI — build, test, migration, and container smoke gates
#
# Runs on every pull request and every push to main. All three jobs must
# pass for a PR to be mergeable once branch protection requires these
# checks (see CONTRIBUTING.md — the workflow file alone cannot enforce
# merge blocking; that is a repo setting).
#
# Jobs:
#   build-and-test  — npm ci, workspace builds, backend + frontend tests
#   migrations      — migrations apply to a fresh DB and the full schema exists
#   container-smoke — the built Docker image reaches /health and serves the app
#   upgrade-tests   — upgrade tests against fixture DBs from the two prior supported versions

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces (shared, backend, frontend)
        run: npm run build

      - name: Backend tests (jest)
        run: npm run test -w packages/backend

      - name: Frontend tests (vitest)
        run: npm run test -w packages/frontend

  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces (shared, backend, frontend)
        run: npm run build

      - name: Apply migrations to a fresh DB and verify the schema
        run: node scripts/ci/verify-migrations.mjs

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [build-and-test, migrations]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t nommable:ci .

      - name: Smoke test — /health and app root
        run: bash ./scripts/ci/smoke-test.sh nommable:ci

  upgrade-tests:
    name: Upgrade tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces (shared, backend, frontend)
        run: npm run build

      - name: Upgrade tests — prior-version fixtures
        run: npm run test -w packages/backend -- src/__tests__/db-upgrade
