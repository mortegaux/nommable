# Release — versioned multi-arch Docker images + GitHub Release (issue #15)
#
# Trigger: push a SemVer tag (vX.Y.Z). The tag is the source of truth for
# the version: the workflow verifies every package.json version matches
# the tag, then tests, builds a multi-arch image, smoke-tests the pushed
# image, promotes the `latest` stable-channel tag only after the smoke
# test passes, and creates the GitHub Release with generated notes.
#
# Cutting a release (see docs/releases.md):
#   1. Bump the version in all four package.json files, commit, push to main.
#   2. Tag the merge commit: git tag v1.1.0 && git push origin v1.1.0
#   3. This workflow does the rest. No local builds, no manual GHCR pushes.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  test:
    name: Version check + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify package.json versions match the tag
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          for f in package.json packages/shared/package.json packages/backend/package.json packages/frontend/package.json; do
            ACTUAL="$(node -p "require('./$f').version")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Version mismatch: $f is $ACTUAL but tag is $TAG (expected $EXPECTED). Bump the version, commit, and re-tag."
              exit 1
            fi
          done
          echo "All package.json versions match $TAG"

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces (shared, backend, frontend)
        run: npm run build

      - name: Backend tests (jest)
        run: npm run test -w packages/backend

      - name: Frontend tests (vitest)
        run: npm run test -w packages/frontend

  release:
    name: Build, push, smoke-test, and release
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push version-tagged image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mortegaux/nommable:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        run: bash ./scripts/ci/smoke-test.sh ghcr.io/mortegaux/nommable:${{ github.ref_name }}

      - name: Promote stable-channel tag (latest) after smoke test
        run: docker buildx imagetools create -t ghcr.io/mortegaux/nommable:latest ghcr.io/mortegaux/nommable:${{ github.ref_name }}

      - name: Create GitHub Release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
